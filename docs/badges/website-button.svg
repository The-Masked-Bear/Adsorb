<svg xmlns="http://www.w3.org/2000/svg" width="280" height="48" viewBox="0 0 280 48" fill="none">
  <style>
    .btn-text {
      font-family: 'Space Mono', 'JetBrains Mono', 'SF Mono', Monaco, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    @media (prefers-color-scheme: dark) {
      .btn-shadow { fill: #000000; }
      .btn-box { stroke: #FFFFFF; }
    }
  </style>
  <rect class="btn-shadow" x="4" y="4" width="272" height="40" fill="#111111"/>
  <rect class="btn-box" x="1.5" y="1.5" width="272" height="40" fill="#8CFFFB" stroke="#111111" stroke-width="3"/>
  <g transform="translate(28, 11)">
    <circle cx="10" cy="10" r="9" stroke="#111111" stroke-width="2.2" fill="none"/>
    <ellipse cx="10" cy="10" rx="4.5" ry="9" stroke="#111111" stroke-width="1.8" fill="none"/>
    <line x1="1" y1="10" x2="19" y2="10" stroke="#111111" stroke-width="1.8"/>
  </g>
  <text class="btn-text" x="150" y="26.5" fill="#111111" text-anchor="middle">OFFICIAL LIVE SITE</text>
</svg>
